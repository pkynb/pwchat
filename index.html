<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>双人聊天</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      color: #1f2937;
      background: #eef1f4;
    }
    button, input { font: inherit; }
    .chat {
      height: 100%;
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: 0 0 0 1px #dfe3e8;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 14px;
      background: #fafbfc;
      border-bottom: 1px solid #dfe3e8;
    }
    .fixed-names { display: flex; gap: 10px; flex-wrap: wrap; }
    .name-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border: 1px solid #cbd2d9;
      border-radius: 6px;
      background: #fff;
      font-size: 13px;
    }
    .name-chip b { font-weight: 600; }
    .name-chip small { color: #64748b; }
    .name-chip.a b { color: #0f766e; }
    .name-chip.b b { color: #b45309; }
    .identity {
      display: flex;
      border: 1px solid #cbd2d9;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }
    .identity button {
      border: 0;
      padding: 8px 12px;
      background: #fff;
      color: #374151;
      cursor: pointer;
    }
    .identity button.active {
      background: #0f766e;
      color: #fff;
    }
    .status {
      margin-left: auto;
      padding: 4px 9px;
      border-radius: 99px;
      font-size: 12px;
      color: #047857;
      background: #ecfdf5;
    }
    .status.offline {
      color: #b91c1c;
      background: #fef2f2;
    }
    .current-identity {
      padding: 6px 10px;
      border-radius: 6px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 13px;
    }
    .start-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #eef1f4;
    }
    .start-screen[hidden] { display: none; }
    .start-panel {
      width: min(420px, 100%);
      padding: 24px;
      background: #fff;
      border: 1px solid #dfe3e8;
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
    }
    .start-panel h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    .start-panel p {
      margin: 0 0 18px;
      color: #64748b;
      font-size: 14px;
    }
    .start-options { display: grid; gap: 10px; }
    .start-option {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd2d9;
      border-radius: 6px;
      background: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    .start-option:hover {
      border-color: #0f766e;
      background: #f0fdfa;
    }
    .start-option small { color: #64748b; }
    .sync-settings {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #e5e7eb;
    }
    .sync-settings label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #374151;
    }
    .sync-row {
      display: flex;
      gap: 8px;
    }
    .sync-row input {
      flex: 1;
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid #cbd2d9;
      border-radius: 6px;
      outline: 0;
    }
    .sync-row button {
      padding: 0 14px;
      border: 1px solid #cbd2d9;
      border-radius: 6px;
      background: #fff;
      color: #374151;
      cursor: pointer;
    }
    .sync-status {
      margin-top: 6px;
      min-height: 18px;
      font-size: 12px;
      color: #047857;
    }
    .quiz-question { margin-bottom: 18px; }
    .quiz-question p { margin: 0 0 8px; }
    .quiz-inputs {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .quiz-inputs span { color: #64748b; }
    .quiz-input {
      width: 88px;
      padding: 9px 10px;
      border: 1px solid #cbd2d9;
      border-radius: 6px;
      outline: 0;
    }
    .quiz-input.full { width: 100%; }
    .quiz-input:focus { border-color: #0f766e; }
    .quiz-error {
      margin: 0 0 12px;
      padding: 9px 10px;
      border-radius: 6px;
      background: #fef2f2;
      color: #b91c1c;
      font-size: 13px;
    }
    .quiz-submit {
      width: 100%;
      padding: 11px 12px;
      border: 0;
      border-radius: 6px;
      background: #0f766e;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f7f9fb;
    }
    .message { max-width: 78%; align-self: flex-start; }
    .message.mine { align-self: flex-end; }
    .bubble {
      padding: 8px 10px;
      background: #fff;
      border: 1px solid #e1e5ea;
      border-radius: 8px 8px 8px 2px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }
    .message.mine .bubble {
      background: #0f766e;
      border-color: #0f766e;
      color: #fff;
      border-radius: 8px 8px 2px 8px;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 5px;
      font-size: 12px;
      color: #64748b;
    }
    .message.mine .meta { color: #d1fae5; }
    .message p {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .message img,
    .message video {
      display: block;
      max-width: 100%;
      max-height: 340px;
      border-radius: 6px;
      margin-bottom: 6px;
      background: #e5e9ee;
    }
    .composer {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid #dfe3e8;
      background: #fff;
    }
    #textInput {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid #cbd2d9;
      border-radius: 6px;
      outline: 0;
    }
    #textInput:focus { border-color: #0f766e; }
    .icon-button,
    #sendButton {
      height: 42px;
      min-width: 62px;
      border: 1px solid #cbd2d9;
      border-radius: 6px;
      padding: 0 12px;
      background: #fff;
      color: #374151;
      cursor: pointer;
    }
    #sendButton {
      min-width: 78px;
      background: #0f766e;
      border-color: #0f766e;
      color: #fff;
    }
    #sendButton:disabled { opacity: 0.6; cursor: default; }
    .attachment-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-top: 1px solid #dfe3e8;
      background: #fffbeb;
      color: #92400e;
      font-size: 13px;
    }
    .attachment-status button {
      border: 0;
      background: transparent;
      color: #b45309;
      cursor: pointer;
      padding: 0;
    }
    @media (max-width: 640px) {
      .topbar { align-items: stretch; }
      .status { margin-left: 0; align-self: flex-start; }
      .message { max-width: 90%; }
      .composer { flex-wrap: wrap; }
      #textInput { flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <div id="startScreen" class="start-screen">
    <div id="identityPanel" class="start-panel">
      <h1 id="identityTitle">选择你是谁</h1>
      <p id="identityHint">pky 是用户 A，wzy 是用户 B。</p>
      <div class="start-options">
        <button class="start-option" type="button" id="startPky"><span>pky</span><small>用户 A</small></button>
        <button class="start-option" type="button" id="startWzy"><span>wzy</span><small>用户 B</small></button>
      </div>
    </div>
    <div id="quizPanel" class="start-panel" hidden>
      <h1>回答问题</h1>
      <p>回答 2 道题后才能进入。</p>
      <form id="quizForm">
        <div id="quizQuestions"></div>
        <div id="quizError" class="quiz-error" hidden>回答错误，请重新回答。</div>
        <button class="quiz-submit" type="submit">进入聊天</button>
      </form>
    </div>
  </div>

  <main class="chat">
    <header class="topbar">
      <div class="fixed-names">
        <span class="name-chip a"><b>pky</b><small>用户 A</small></span>
        <span class="name-chip b"><b>wzy</b><small>用户 B</small></span>
      </div>
      <div id="currentIdentity" class="current-identity">未选择</div>
      <div id="status" class="status">连接中</div>
    </header>

    <section id="messages" class="messages" aria-live="polite"></section>

    <footer class="composer">
      <input id="textInput" type="text" placeholder="输入消息" maxlength="2000" autocomplete="off">
      <input id="imageInput" type="file" accept="image/*" hidden>
      <input id="videoInput" type="file" accept="video/*" hidden>
      <button id="imageButton" class="icon-button" type="button" title="选择图片">图片</button>
      <button id="videoButton" class="icon-button" type="button" title="选择视频">视频</button>
      <button id="sendButton" type="button">发送</button>
    </footer>

    <div id="attachmentStatus" class="attachment-status" hidden>
      <span id="attachmentLabel"></span>
      <button id="clearAttachment" type="button">清除</button>
    </div>
  </main>

  <script src="paho-mqtt.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const SETTINGS_KEY = "twoPersonChatSettings";
      const LEGACY_HISTORY_KEY = "twoPersonChatHistory";
      const DB_NAME = "twoPersonChatDB";
      const DB_VERSION = 1;
      const MAX_FILE_BYTES = 1024 * 1024;
      const MQTT_HOST = "broker.hivemq.com";
      const MQTT_PORT = 8884;
      const MQTT_TOPIC_PREFIX = "pwchat/pkynb/msg/";

      // 题目和答案集中在这里，改这一块即可。
      const QUESTIONS = [
        {
          id: "pky-birthday",
          kind: "birthday",
          prompt: "pky 的生日是",
          month: 8,
          day: 23
        },
        {
          id: "wzy-birthday",
          kind: "birthday",
          prompt: "wzy 的生日是",
          month: 8,
          day: 21
        },
        {
          id: "pky-book",
          kind: "text",
          prompt: "高一下学期，pky 借给 wzy 的是 ____ 笔记",
          accepts: ["数学", "数学笔记"]
        },
        {
          id: "wzy-notes",
          kind: "text",
          prompt: "高一下学期，wzy 借给 pky 的是 ____ 书",
          accepts: ["物理", "物理书"]
        }
      ];

      const textInput = $("textInput");
      const messagesEl = $("messages");
      const sendButton = $("sendButton");
      const imageInput = $("imageInput");
      const videoInput = $("videoInput");
      const attachmentStatus = $("attachmentStatus");
      const attachmentLabel = $("attachmentLabel");

      let meSide = null;
      let savedSide = null;
      let pendingSide = null;
      let currentQuizQuestions = [];
      let messages = [];
      let seen = new Set();
      let serverIds = new Set();
      let selectedFile = null;
      let dbPromise = null;
      let mqttClient = null;
      let mqttConnected = false;

      function openDatabase() {
        if (dbPromise) return dbPromise;
        dbPromise = new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains("messages")) {
              db.createObjectStore("messages", { keyPath: "id" });
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
        return dbPromise;
      }

      async function loadLocalMessages() {
        const db = await openDatabase();
        return new Promise((resolve, reject) => {
          const tx = db.transaction("messages", "readonly");
          const request = tx.objectStore("messages").getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });
      }

      async function persistLocalMessages(list) {
        const db = await openDatabase();
        return new Promise((resolve, reject) => {
          const tx = db.transaction("messages", "readwrite");
          const store = tx.objectStore("messages");
          for (const message of list) {
            store.put(message);
          }
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      }

      function currentName() {
        return meSide === "B" ? "wzy" : "pky";
      }

      function formatTime(value) {
        const date = new Date(value);
        if (isNaN(date.getTime())) return "";
        const pad = (n) => String(n).padStart(2, "0");
        return `${pad(date.getHours())}:${pad(date.getMinutes())}`;
      }

      function formatBytes(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      }

      function loadSettings() {
        try {
          const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
          if (saved.side === "A" || saved.side === "B") {
            savedSide = saved.side;
          }
        } catch {}
      }

      function prepareIdentityScreen() {
        if (savedSide === "A") {
          $("startWzy").hidden = true;
          $("identityTitle").textContent = "确认你是谁";
          $("identityHint").textContent = "身份已固定为 pky（用户 A），确认后回答问题。";
        } else if (savedSide === "B") {
          $("startPky").hidden = true;
          $("identityTitle").textContent = "确认你是谁";
          $("identityHint").textContent = "身份已固定为 wzy（用户 B），确认后回答问题。";
        }
      }

      function chooseIdentity(side) {
        pendingSide = side;
        $("identityPanel").hidden = true;
        $("quizPanel").hidden = false;
        renderQuiz(pickQuestions());
      }

      function pickQuestions() {
        return [...QUESTIONS].sort(() => Math.random() - 0.5).slice(0, 2);
      }

      function renderQuiz(questions) {
        currentQuizQuestions = questions;
        const container = $("quizQuestions");
        container.replaceChildren();

        questions.forEach((question, index) => {
          const field = document.createElement("div");
          field.className = "quiz-question";
          const label = document.createElement("p");
          label.textContent = `${index + 1}. ${question.prompt}`;
          field.append(label);

          if (question.kind === "birthday") {
            const row = document.createElement("div");
            row.className = "quiz-inputs";

            const month = document.createElement("input");
            month.className = "quiz-input";
            month.dataset.qid = question.id;
            month.dataset.field = "month";
            month.type = "text";
            month.inputMode = "numeric";
            month.maxLength = 2;
            month.placeholder = "月";

            const monthText = document.createElement("span");
            monthText.textContent = "月";

            const day = document.createElement("input");
            day.className = "quiz-input";
            day.dataset.qid = question.id;
            day.dataset.field = "day";
            day.type = "text";
            day.inputMode = "numeric";
            day.maxLength = 2;
            day.placeholder = "日";

            const dayText = document.createElement("span");
            dayText.textContent = "日";

            row.append(month, monthText, day, dayText);
            field.append(row);
          } else {
            const input = document.createElement("input");
            input.className = "quiz-input full";
            input.dataset.qid = question.id;
            input.dataset.field = "answer";
            input.type = "text";
            input.placeholder = "填写";
            input.autocomplete = "off";
            field.append(input);
          }

          container.append(field);
        });

        $("quizError").hidden = true;
      }

      function checkAnswer(question, values) {
        if (question.kind === "birthday") {
          return parseInt(values.month, 10) === question.month
            && parseInt(values.day, 10) === question.day;
        }
        const normalize = (value) => String(value || "").replace(/\s+/g, "").toLowerCase();
        return question.accepts.some((answer) => normalize(answer) === normalize(values.answer));
      }

      function submitQuiz(event) {
        event.preventDefault();
        const inputs = Array.from(document.querySelectorAll("#quizQuestions .quiz-input"));
        let allCorrect = true;

        for (const question of currentQuizQuestions) {
          const values = {};
          for (const input of inputs) {
            if (input.dataset.qid === question.id) {
              values[input.dataset.field] = input.value.trim();
            }
          }
          if (!checkAnswer(question, values)) {
            allCorrect = false;
          }
        }

        if (!allCorrect) {
          $("quizError").hidden = false;
          inputs.forEach((input) => { input.value = ""; });
          return;
        }

        enterChat(pendingSide);
      }

      function enterChat(side) {
        meSide = side;
        savedSide = side;
        localStorage.setItem(SETTINGS_KEY, JSON.stringify({ side }));
        $("startScreen").hidden = true;
        $("currentIdentity").textContent = side === "A" ? "当前：pky（用户 A）" : "当前：wzy（用户 B）";
        render();
      }

      function render() {
        messagesEl.replaceChildren();
        for (const message of messages) {
          const article = document.createElement("article");
          article.className = "message" + (message.side === meSide ? " mine" : "");

          const bubble = document.createElement("div");
          bubble.className = "bubble";

          const meta = document.createElement("div");
          meta.className = "meta";
          const name = document.createElement("span");
          name.textContent = message.side === "B" ? "wzy" : "pky";
          const time = document.createElement("time");
          time.textContent = formatTime(message.createdAt);
          meta.append(name, time);
          bubble.append(meta);

          const mediaSource = message.mediaData || message.mediaUrl;
          if (message.type === "image" && mediaSource) {
            const img = document.createElement("img");
            img.src = mediaSource;
            img.alt = "图片";
            img.loading = "lazy";
            bubble.append(img);
          }

          if (message.type === "video" && mediaSource) {
            const video = document.createElement("video");
            video.src = mediaSource;
            video.controls = true;
            video.preload = "metadata";
            bubble.append(video);
          }

          if (message.text) {
            const text = document.createElement("p");
            text.textContent = message.text;
            bubble.append(text);
          }

          article.append(bubble);
          messagesEl.append(article);
        }
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function saveHistory() {
        persistLocalMessages(messages).catch(() => {});
      }

      function mergeMessages(incoming, persist = true) {
        let changed = false;
        for (const message of incoming) {
          if (!message || !message.id || seen.has(message.id)) continue;
          seen.add(message.id);
          messages.push(message);
          changed = true;
        }
        if (!changed) return;
        messages.sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
        render();
        if (persist) saveHistory();
      }

      function setStatus(online) {
        const status = $("status");
        status.textContent = online ? "在线" : "未连接";
        status.classList.toggle("offline", !online);
      }

      function makeMessageId() {
        if (window.crypto && crypto.randomUUID) {
          return crypto.randomUUID();
        }
        return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      }

      function handleRemotePayload(rawMessage) {
        let data;
        try {
          data = JSON.parse(rawMessage);
        } catch {
          return;
        }
        if (!data || data.type !== "message" || !data.message) return;
        const message = data.message;
        if (message && message.id) {
          serverIds.add(message.id);
        }
        mergeMessages([message]);
      }

      async function publishPayload(payload) {
        const response = await fetch(`${NTFY_BASE}/${NTFY_TOPIC}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!response.ok) {
          throw new Error("publish failed");
        }
        return response.json();
      }

      function getGitHubToken() {
        try {
          return localStorage.getItem(GITHUB_TOKEN_KEY) || "";
        } catch {
          return "";
        }
      }

      function setGitHubToken(token) {
        localStorage.setItem(GITHUB_TOKEN_KEY, token);
      }

      function rememberServerMessages(list) {
        for (const message of list || []) {
          if (message && message.id) serverIds.add(message.id);
        }
      }

      function githubHeaders() {
        return {
          Authorization: `Bearer ${getGitHubToken()}`,
          Accept: "application/vnd.github+json"
        };
      }

      async function loadGitHubHistory() {
        try {
          const response = await fetch(`https://raw.githubusercontent.com/${GITHUB_REPO}/${GITHUB_BRANCH}/${GITHUB_CHAT_FILE}`, { cache: "no-store" });
          if (!response.ok) return;
          const data = await response.json();
          const list = Array.isArray(data) ? data : (data.messages || []);
          rememberServerMessages(list);
          mergeMessages(list);
        } catch {}
      }

      function decodeBase64(value) {
        const binary = atob(value.replace(/\s+/g, ""));
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
        return new TextDecoder().decode(bytes);
      }

      function encodeBase64(value) {
        const bytes = new TextEncoder().encode(value);
        let binary = "";
        for (const byte of bytes) binary += String.fromCharCode(byte);
        return btoa(binary);
      }

      async function fetchGitHubChat() {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_CHAT_FILE}`, {
          headers: githubHeaders()
        });
        if (response.status === 404) {
          return { messages: [], sha: null };
        }
        if (!response.ok) {
          throw new Error("read chat failed");
        }
        const data = await response.json();
        let parsed;
        try {
          parsed = JSON.parse(decodeBase64(data.content));
        } catch {
          parsed = [];
        }
        const messages = Array.isArray(parsed) ? parsed : (parsed.messages || []);
        return { messages, sha: data.sha };
      }

      async function writeGitHubChat(messages, sha) {
        const body = {
          message: "sync chat",
          content: encodeBase64(JSON.stringify({ messages }, null, 2)),
          branch: GITHUB_BRANCH
        };
        if (sha) body.sha = sha;
        const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_CHAT_FILE}`, {
          method: "PUT",
          headers: githubHeaders(),
          body: JSON.stringify(body)
        });
        if (!response.ok) {
          throw new Error("write chat failed");
        }
        return response.json();
      }

      async function saveMessageToGitHub(message) {
        const outgoing = { ...message };
        delete outgoing.mediaData;
        for (let attempt = 0; attempt < 3; attempt += 1) {
          try {
            const current = await fetchGitHubChat();
            if (current.messages.some((item) => item.id === outgoing.id)) return;
            current.messages.push(outgoing);
            await writeGitHubChat(current.messages, current.sha);
            rememberServerMessages([outgoing]);
            return;
          } catch (error) {
            if (attempt === 2) throw error;
          }
        }
      }

      function extensionForMime(mime) {
        const map = {
          "image/png": ".png",
          "image/jpeg": ".jpg",
          "image/gif": ".gif",
          "image/webp": ".webp",
          "video/mp4": ".mp4",
          "video/webm": ".webm",
          "video/quicktime": ".mov",
          "video/x-m4v": ".m4v"
        };
        if (map[mime]) return map[mime];
        const fallback = mime.split("/")[1] || "bin";
        return `.${fallback.replace(/[^a-z0-9]/gi, "") || "bin"}`;
      }

      async function uploadMediaToGitHub(file, id) {
        const ext = extensionForMime(file.type);
        const filename = `${id}${ext}`;
        const path = `uploads/${filename}`;
        const bytes = new Uint8Array(await file.arrayBuffer());
        let binary = "";
        for (const byte of bytes) binary += String.fromCharCode(byte);
        const body = {
          message: "upload media",
          content: btoa(binary),
          branch: GITHUB_BRANCH
        };
        const encodedPath = path.split("/").map((part) => encodeURIComponent(part)).join("/");
        const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${encodedPath}`, {
          method: "PUT",
          headers: githubHeaders(),
          body: JSON.stringify(body)
        });
        if (!response.ok) {
          throw new Error("upload media failed");
        }
        return `https://raw.githubusercontent.com/${GITHUB_REPO}/${GITHUB_BRANCH}/uploads/${filename}`;
      }

      function syncLocalHistory() {
        const missing = messages.filter((message) => !serverIds.has(message.id));
        for (const message of missing) {
          const outgoing = { ...message };
          delete outgoing.mediaData;
          publishPayload({ type: "message", message: outgoing })
            .then(() => serverIds.add(message.id))
            .catch(() => {});
        }
      }

      function connectNtfy() {
        if (ntfySocket) return;

        const socket = new WebSocket(`wss://ntfy.sh/${NTFY_TOPIC}/ws?since=all`);
        ntfySocket = socket;

        socket.onopen = () => {
          ntfyConnected = true;
          setStatus(true);
          setTimeout(syncLocalHistory, 1500);
        };

        socket.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data && data.event === "message" && data.message) {
              handleRemotePayload(data.message);
            }
          } catch {}
        };

        socket.onerror = () => setStatus(false);

        socket.onclose = () => {
          ntfyConnected = false;
          setStatus(false);
          ntfySocket = null;
          setTimeout(connectNtfy, 5000);
        };
      }

      function mqttTopic(messageId) {
        return MQTT_TOPIC_PREFIX + messageId;
      }

      function handleMqttMessage(message) {
        if (!message.destinationName.startsWith(MQTT_TOPIC_PREFIX)) return;
        try {
          const data = JSON.parse(message.payloadString);
          if (!data || !data.message || !data.message.id) return;
          serverIds.add(data.message.id);
          mergeMessages([data.message]);
        } catch {}
      }

      function publishMqttMessage(message) {
        const payload = JSON.stringify({ message });
        mqttClient.publish(mqttTopic(message.id), payload, 1, true);
      }

      function syncMqttHistory() {
        if (!mqttConnected || !mqttClient) return;
        const missing = messages.filter((message) => !serverIds.has(message.id));
        for (const message of missing) {
          const outgoing = { ...message };
          delete outgoing.mediaData;
          publishMqttMessage(outgoing);
          serverIds.add(message.id);
        }
      }

      function connectMqtt() {
        if (!window.Paho || mqttClient) return;

        mqttClient = new Paho.Client(MQTT_HOST, MQTT_PORT, `pwchat-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`);
        mqttClient.onConnectionLost = () => {
          mqttConnected = false;
          setStatus(false);
          setTimeout(() => {
            mqttClient = null;
            connectMqtt();
          }, 5000);
        };
        mqttClient.onMessageArrived = handleMqttMessage;
        mqttClient.connect({
          useSSL: true,
          timeout: 10,
          keepAliveInterval: 30,
          cleanSession: true,
          onSuccess: () => {
            mqttConnected = true;
            mqttClient.subscribe(MQTT_TOPIC_PREFIX + "#", { qos: 0 });
            setStatus(true);
            setTimeout(syncMqttHistory, 1000);
          },
          onFailure: () => {
            mqttConnected = false;
            setStatus(false);
            setTimeout(() => {
              mqttClient = null;
              connectMqtt();
            }, 5000);
          }
        });
      }

      function importLegacyHistory() {
        try {
          const legacy = JSON.parse(localStorage.getItem(LEGACY_HISTORY_KEY) || "[]");
          if (Array.isArray(legacy) && legacy.length > 0) {
            mergeMessages(legacy, true);
          }
        } catch {}
      }

      function fileToDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(file);
        });
      }

      function showAttachment(text) {
        attachmentLabel.textContent = text;
        attachmentStatus.hidden = false;
      }

      function clearAttachment() {
        selectedFile = null;
        imageInput.value = "";
        videoInput.value = "";
        attachmentLabel.textContent = "";
        attachmentStatus.hidden = true;
      }

      function selectFile(file) {
        if (file.size > MAX_FILE_BYTES) {
          showAttachment("文件不能超过 30MB");
          return;
        }
        selectedFile = file;
        const kind = file.type.startsWith("video/") ? "视频" : "图片";
        showAttachment(`${kind}：${file.name}（${formatBytes(file.size)}）`);
      }

      async function sendMessage() {
        const text = textInput.value.trim();
        if (!text && !selectedFile) return;
        if (!mqttConnected || !mqttClient) {
          showAttachment("未连接，请稍后重试");
          setStatus(false);
          return;
        }

        const message = {
          id: makeMessageId(),
          side: meSide,
          from: currentName(),
          text,
          type: "text",
          createdAt: new Date().toISOString()
        };

        sendButton.disabled = true;
        try {
          if (selectedFile) {
            message.mediaData = await fileToDataUrl(selectedFile);
            message.mime = selectedFile.type;
            message.type = selectedFile.type.startsWith("video/") ? "video" : "image";
          }

          publishMqttMessage(message);
          serverIds.add(message.id);
          mergeMessages([message]);
          textInput.value = "";
          clearAttachment();
          setStatus(true);
        } catch {
          showAttachment("发送失败，请检查网络");
          setStatus(false);
        } finally {
          sendButton.disabled = false;
        }
      }

      $("startPky").addEventListener("click", () => chooseIdentity("A"));
      $("startWzy").addEventListener("click", () => chooseIdentity("B"));
      $("quizForm").addEventListener("submit", submitQuiz);
      $("imageButton").addEventListener("click", () => imageInput.click());
      $("videoButton").addEventListener("click", () => videoInput.click());
      imageInput.addEventListener("change", () => {
        if (imageInput.files[0]) selectFile(imageInput.files[0]);
      });
      videoInput.addEventListener("change", () => {
        if (videoInput.files[0]) selectFile(videoInput.files[0]);
      });
      sendButton.addEventListener("click", sendMessage);
      textInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") sendMessage();
      });
      $("clearAttachment").addEventListener("click", clearAttachment);

      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().catch(() => {});
      }

      loadSettings();
      prepareIdentityScreen();
      loadLocalMessages()
        .then((saved) => {
          if (Array.isArray(saved)) mergeMessages(saved, false);
          importLegacyHistory();
          connectMqtt();
        })
        .catch(() => {
          importLegacyHistory();
          connectMqtt();
        });
    })();
  </script>
</body>
</html>
